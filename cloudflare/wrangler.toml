name = "zl2-remote-relay"
main = "worker.js"
compatibility_date = "2025-01-01"

# 有自定义域名的可以改成 routes，不改也不影响使用
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# 新项目必须用 SQLite 版 Durable Object（免费计划只支持这个）
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# 可选：设置后在 App 的 Worker 地址末尾加上 ?key=你的口令
# [vars]
# RELAY_KEY = "换成一串只有你知道的字符"
